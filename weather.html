<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지금 날씨</title>
<style>
  body { font-family: Pretendard, system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f4f6fa; color: #1a2340; }
  main { text-align: center; padding: 16px; }
  #icon { font-size: 96px; }
  #temp { font-size: 48px; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1 id="place"></h1>
  <div id="icon" aria-hidden="true"></div>
  <div id="temp">불러오는 중…</div>
  <div id="desc"></div>
</main>
<script>
// 동네를 바꾸려면 이름과 위도·경도만 고치면 된다.
const PLACE = { name: "의성", lat: 36.3527, lon: 128.697 };

// WMO 날씨 코드 → [설명, 이모지]
const WMO = {
  0: ["맑음", "☀️"], 1: ["대체로 맑음", "🌤️"], 2: ["구름 조금", "⛅"], 3: ["흐림", "☁️"],
  45: ["안개", "🌫️"], 48: ["서리 안개", "🌫️"],
  51: ["약한 이슬비", "🌦️"], 53: ["이슬비", "🌦️"], 55: ["강한 이슬비", "🌦️"],
  56: ["약한 어는 이슬비", "🌧️"], 57: ["강한 어는 이슬비", "🌧️"],
  61: ["약한 비", "🌧️"], 63: ["비", "🌧️"], 65: ["강한 비", "🌧️"],
  66: ["약한 어는 비", "🌧️"], 67: ["강한 어는 비", "🌧️"],
  71: ["약한 눈", "🌨️"], 73: ["눈", "🌨️"], 75: ["강한 눈", "❄️"], 77: ["싸락눈", "❄️"],
  80: ["약한 소나기", "🌦️"], 81: ["소나기", "🌧️"], 82: ["강한 소나기", "⛈️"],
  85: ["약한 눈 소나기", "🌨️"], 86: ["강한 눈 소나기", "❄️"],
  95: ["뇌우", "⛈️"], 96: ["우박 동반 뇌우", "⛈️"], 99: ["강한 우박 동반 뇌우", "⛈️"],
};

const $ = id => document.getElementById(id);
$("place").textContent = PLACE.name;

const url = `https://api.open-meteo.com/v1/forecast?latitude=${PLACE.lat}&longitude=${PLACE.lon}&current=temperature_2m,weather_code&timezone=auto`;

fetch(url)
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(({ current }) => {
    const [text, emoji] = WMO[current.weather_code] ?? ["알 수 없음", "❓"];
    $("icon").textContent = emoji;
    $("temp").textContent = `${current.temperature_2m}°C`;
    $("desc").textContent = text;
  })
  .catch(() => { $("temp").textContent = "날씨를 불러오지 못했어요"; });
</script>
</body>
</html>
